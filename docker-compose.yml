services:
  postgres:
    image: postgres:17
    container_name: taskmanager-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "Nurlybek060705/"
      POSTGRES_DB: taskmanager

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  redis:
    image: redis:7
    container_name: taskmanager-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    container_name: taskmanager-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    restart: unless-stopped


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskmanager-app

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"

      DATABASE_URL: "postgresql://admin:Nurlybek060705%2F@postgres:5432/taskmanager?schema=public"

      JWT_SECRET: "change-this-production-secret"
      JWT_EXPIRES_IN: "7d"

      REDIS_URL: "redis://redis:6379"

      CLIENT_URL: "http://localhost:5500"

      ENABLE_SWAGGER: "true"

    depends_on:
      - postgres
      - redis

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data: